<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#101A3A">
    <title>0825刘亦菲生日快乐</title>
    <link rel="shortcut icon" href="/img/333.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-container" id="bgContainer">
        <audio id="bgAudio" loop></audio>
        
        <div class="overlay-layer" id="overlayLayer">
            <div class="main-window" id="mainWindow">
                <div class="title-bar">
                    <span class="title-text" id="titleText">生日快乐</span>
                    <button class="close-btn" id="mainCloseBtn">×</button>
                </div>
                <div class="content-area">
                    <div class="greeting-text" id="greetingText">
                        0825刘亦菲生日快乐 🎂<br>
                        愿所有美好如约而至 💝
                    </div>
                    <div class="button-group">
                        <button class="btn btn-primary" id="startBtn">生日快乐</button>
                        <button class="btn btn-secondary" id="skipBtn">悄悄溜走</button>
                    </div>
                </div>
            </div>

            <button class="music-btn" id="musicBtn" type="button" title="音乐开关" aria-label="音乐开关">
                <svg viewBox="0 0 32 32" class="music-icon" aria-hidden="true">
                    <ellipse class="m-head" cx="12" cy="23" rx="5.2" ry="4.2" transform="rotate(-20 12 23)"/>
                    <path class="m-stem" d="M16.4 6.2 L16.4 22.6 L18.3 22.6 L18.3 7.6 Z"/>
                    <path class="m-flag" d="M18.3 6.2 C22 6.8 25 9 25.8 12.6 C23.4 10.2 21 9.2 18.3 10 Z"/>
                    <path class="m-wave" d="M24.6 16.4 C27 18.2 27 21.6 24.6 23.4"/>
                    <path class="m-wave" d="M27.6 14 C31.2 17.4 31.2 22.6 27.6 26"/>
                    <path class="m-slash" d="M6 26.5 L26.5 6"/>
                </svg>
                <span class="music-no" id="musicNo"></span>
            </button>

            <div class="close-all-btn" id="closeAllBtn" title="收下全部">
                <svg viewBox="0 0 32 32" class="heart-icon">
                    <path d="M16 28 L4 16 C0 12 0 6 4 3 C8 0 14 2 16 7 C18 2 24 0 28 3 C32 6 32 12 28 16 Z" 
                          fill="rgba(122, 92, 176, 0.35)" stroke="rgba(199, 168, 232, 0.75)" stroke-width="1.2"/>
                </svg>
                <span class="close-all-text">收下全部</span>
            </div>

            <div class="restart-btn" id="restartBtn">
                <svg viewBox="0 0 32 32" class="restart-icon">
                    <path d="M16 4 A12 12 0 1 0 28 16 L24 16 A8 8 0 1 1 16 8 L20 12 L16 16 L12 12 Z" 
                          fill="rgba(122, 92, 176, 0.35)" stroke="rgba(199, 168, 232, 0.75)" stroke-width="1.2"/>
                </svg>
                <span class="restart-text">重新开启</span>
            </div>

            <div class="cake-stage" id="cakeStage"></div>

            <div class="wishes-container" id="wishesContainer"></div>

            <div class="footer-notice">
                <span>本作品仅供个人交流学习使用，严禁用于任何商业用途</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
